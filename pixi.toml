[workspace]
authors = ["AISidesKicks <198066858+AISidesKicks@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "sclt"
platforms = ["linux-64"]
version = "0.1.0"

[activation]

[activation.env]
TMPDIR = "/run/user/$UID/pixi_tmp/$PIXI_PROJECT_NAME"
SCRATCH = "$PIXI_PROJECT_ROOT/scratch"

[tasks]

[dependencies]
python = "==3.12"

[pypi-dependencies]
torch = ">=2.14.0, <3"
transformers = ">=5"
numpy = "<2"
huggingface-hub = ">=1.32.0, <2"
datasets = ">=5.0.1, <6"
accelerate = ">=1.15.0, <2"
scikit-learn = ">=1.9.1, <2"
pytest = ">=9.1.1, <10"
bitsandbytes = ">=0.50.2, <0.51"
